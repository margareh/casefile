<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murder Mystery</title>
<style>
:root{--felt:#17302a;--felt2:#1f3d35;--ink:#efe8d6;--dim:#a9b8ae;--brass:#c9a24d;--wine:#8e2f3b;--line:#35574c;
--serif:"Iowan Old Style",Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--felt);color:var(--ink);font:17px/1.6 var(--serif);padding-bottom:env(safe-area-inset-bottom,0)}
main{max-width:46rem;margin:0 auto;padding:1.25rem}
h1{font-size:2.1rem;line-height:1.15;margin:.2em 0;letter-spacing:.01em}
h2{font-size:1.25rem;margin:1.6em 0 .4em;color:var(--brass)}
h3{margin:0;font-size:1.1rem}
p{margin:.4em 0}.dim{color:var(--dim)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--felt2);border:1px solid var(--line);border-radius:4px;padding:.6rem .7rem}
textarea{min-height:5.5rem;resize:vertical;margin-top:.5rem}
button{background:var(--brass);color:#1a1405;border:0;border-radius:4px;padding:.6rem 1rem;font-weight:600;cursor:pointer}
button.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.row{display:flex;gap:.6rem;align-items:center}.row>*:first-child{flex:1}
.stack>*+*{margin-top:.9rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;border-bottom:1px solid var(--line);padding-bottom:.6rem}
.tabs{display:flex;gap:.4rem;margin:1rem 0}
.tabs button{background:none;color:var(--dim);border:1px solid var(--line)}
.tabs button[aria-selected=true]{background:var(--brass);color:#1a1405;border-color:var(--brass)}
.card{background:var(--felt2);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:4px;padding:.9rem 1rem}
.card.locked{border-left-color:var(--wine)}
ul{margin:.3em 0;padding-left:1.2rem}
label.chk{display:flex;gap:.6rem;align-items:flex-start}label.chk input{width:auto;margin-top:.45rem}
.done{text-decoration:line-through;color:var(--dim)}
.err{color:#f0a0a8;min-height:1.4em;margin:.3em 0}
</style>
</head>
<body>
<main id="app"><p class="dim">Loading…</p></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.normalize('NFKC').trim().toLowerCase().replace(/\s+/g, ' ');
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let D, me = null, st = null, tab = 'me';

async function dec(blob, secret) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(secret)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(blob.s), iterations:D.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(blob.i)}, key, b64(blob.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
const readStore = id => { try { return JSON.parse(localStorage.getItem('mm:' + id)) || {}; } catch { return {}; } };
const save = () => { try { localStorage.setItem('mm:' + me.id, JSON.stringify(st)); } catch {} };

async function login(id, pass) {
  const ch = D.characters.find(c => c.id === id);
  try { var base = await dec(ch.base, pass); } catch { return false; }
  me = {...ch, pass, base, clues: []};
  st = Object.assign({notes:{}, codes:[], done:{}}, readStore(id));
  for (let i = 0; i < ch.rounds.length; i++) {
    if (st.codes[i]) { try { me.clues[i] = (await dec(ch.rounds[i], pass + '|' + st.codes[i])).clue; } catch {} }
  }
  try { sessionStorage.setItem('mm:session', JSON.stringify({id, pass})); } catch {}
  return true;
}
function logout() { me = null; try { sessionStorage.removeItem('mm:session'); } catch {} render(); }

function render() {
  if (!me) return renderLogin();
  const others = D.characters.filter(c => c.id !== me.id);
  const rounds = me.rounds.map((_, i) => {
    const clue = me.clues[i];
    return clue
      ? `<div class="card"><h3>Round ${i+1}</h3><p>${esc(clue)}</p></div>`
      : `<form class="card locked" data-round="${i}"><h3>Round ${i+1}</h3>
         <p class="dim">Locked. Enter the code your host announces.</p>
         <div class="row"><input name="code" autocomplete="off" aria-label="Round ${i+1} code"><button>Reveal round ${i+1}</button></div>
         <p class="err" role="alert"></p></form>`;
  }).join('');
  const quests = me.base.sideQuests.map((q, i) =>
    `<li style="list-style:none"><label class="chk"><input type="checkbox" data-quest="${i}" ${st.done[i] ? 'checked' : ''}><span class="${st.done[i] ? 'done' : ''}">${esc(q)}</span></label></li>`).join('');
  const cast = others.map(c => `<div class="card"><h3>${esc(c.name)}</h3><p class="dim">${esc(c.description)}</p>
      <textarea data-note="${c.id}" aria-label="Notes on ${esc(c.name)}" placeholder="Your private notes on ${esc(c.name)}">${esc(st.notes[c.id] || '')}</textarea></div>`).join('');
  $('#app').innerHTML = `
    <div class="bar"><span class="dim">${esc(D.title)}</span><button class="ghost" data-act="logout">Log out</button></div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="${tab==='me'}" data-tab="me">My character</button>
      <button role="tab" aria-selected="${tab==='cast'}" data-tab="cast">Cast and notes</button></div>
    ${tab === 'me' ? `<div class="stack">
      <h1>${esc(me.name)}</h1><p>${esc(me.description)}</p>
      <h2>Hidden skills</h2><ul>${me.base.skills.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
      <h2>Side quests</h2><ul style="padding:0">${quests}</ul>
      <h2>Secrets and clues</h2>${rounds}</div>`
    : `<div class="stack"><p class="dim">Notes stay on this device and are never shared.</p>${cast}
      <div class="row"><button class="ghost" data-act="copy">Copy all notes</button><span class="dim" id="copied"></span></div></div>`}`;
}

function renderLogin() {
  $('#app').innerHTML = `<h1>${esc(D.title)}</h1><p>${esc(D.intro)}</p>
    <form id="login" class="stack" style="margin-top:1.5rem">
      <label>Who are you playing?<select name="who">${D.characters.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>
      <label>Your passphrase<input name="pass" type="password" autocomplete="off" required></label>
      <p class="err" role="alert" id="loginErr"></p>
      <button>Open my character</button></form>
    <h2>The cast</h2><div class="stack">${D.characters.map(c => `<div class="card"><h3>${esc(c.name)}</h3><p class="dim">${esc(c.description)}</p></div>`).join('')}</div>`;
}

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'login') {
    const ok = await login(f.who.value, f.pass.value);
    if (ok) render(); else $('#loginErr').textContent = "That passphrase doesn't match this character. Check the spelling and try again.";
  } else if (f.dataset.round !== undefined) {
    const i = +f.dataset.round, code = f.code.value;
    try {
      me.clues[i] = (await dec(me.rounds[i], me.pass + '|' + code)).clue;
      st.codes[i] = code; save(); render();
    } catch { f.querySelector('.err').textContent = `That code doesn't open round ${i + 1}. Check with your host.`; }
  }
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); }
  else if (t.dataset.act === 'logout') logout();
  else if (t.dataset.act === 'copy') {
    const txt = D.characters.filter(c => st.notes[c.id]).map(c => `${c.name}\n${st.notes[c.id]}`).join('\n\n');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(
      () => $('#copied').textContent = 'Copied.', () => $('#copied').textContent = 'Copy failed. Select the text in each note instead.');
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.note) { st.notes[e.target.dataset.note] = e.target.value; save(); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.quest !== undefined) { st.done[e.target.dataset.quest] = e.target.checked; save(); render(); }
});

(async () => {
  try { D = await (await fetch('data.json')).json(); }
  catch { $('#app').innerHTML = '<p>Could not load data.json. Run <code>node build.mjs</code> and serve this folder over http.</p>'; return; }
  document.title = D.title;
  try { const s = JSON.parse(sessionStorage.getItem('mm:session')); if (s) await login(s.id, s.pass); } catch {}
  render();
})();
</script>
</body>
</html>
