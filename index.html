<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murder Mystery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"><p class="dim">Loading…</p></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.normalize('NFKC').trim().toLowerCase().replace(/\s+/g, ' ');
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let D, me = null, st = null, tab = 'me';
const nameOf = id => D.characters.find(c => c.id === id).name;
const initials = n => n.replace(/^(Dr|Mr|Mrs|Ms|Madame|Colonel|Sir|Lady)\.?\s+/i, '').split(' ').map(w => w[0]).join('').slice(0, 2);
const avatar = (c, lg, jailed) => `<span class="avatar${lg ? ' lg' : ''}${jailed ? ' jailed' : ''}">${esc(initials(c.name))}${c.image ? `<img src="${esc(c.image)}" alt="" onerror="this.remove()">` : ''}</span>`;
const curRound = () => { for (let i = me.clues.length - 1; i >= 0; i--) if (me.clues[i]) return i; return -1; };

async function dec(blob, secret) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(secret)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(blob.s), iterations:D.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(blob.i)}, key, b64(blob.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
const readStore = id => { try { return JSON.parse(localStorage.getItem('mm:' + id)) || {}; } catch { return {}; } };
const save = () => { try { localStorage.setItem('mm:' + me.id, JSON.stringify(st)); } catch {} };

async function unlock(i, code) {
  me.clues[i] = (await dec(me.rounds[i], me.pass + '|' + code)).clues;
}
async function login(id, pass) {
  const ch = D.characters.find(c => c.id === id);
  try { var base = await dec(ch.base, pass); } catch { return false; }
  me = {...ch, pass, base, clues: []};
  st = Object.assign({notes:{}, codes:[], done:{}, jail:{}}, readStore(id));
  for (let i = 0; i < ch.rounds.length; i++) {
    if (st.codes[i]) { try { await unlock(i, st.codes[i]); } catch {} }
  }
  try { sessionStorage.setItem('mm:session', JSON.stringify({id, pass})); } catch {}
  return true;
}
function logout() { me = null; try { sessionStorage.removeItem('mm:session'); } catch {} render(); }

function render() {
  if (!me) return renderLogin();
  const others = D.characters.filter(c => c.id !== me.id);
  const rounds = me.rounds.map((_, i) => {
    const clues = me.clues[i];
    return clues
      ? `<div class="card"><h3>Round ${i+1}</h3>${clues.map(c => `<p>${esc(c)}</p>`).join('')}</div>`
      : `<form class="card locked" data-round="${i}"><h3>Round ${i+1}</h3>
         <p class="dim">Locked. Enter the code your host announces.</p>
         <div class="row"><input name="roundcode" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Round ${i+1} code"><button>Reveal round ${i+1}</button></div>
         <p class="err" role="alert"></p></form>`;
  }).join('');
  const quests = me.base.sideQuests.map((q, i) =>
    `<li style="list-style:none"><label class="chk"><input type="checkbox" data-quest="${i}" ${st.done[i] ? 'checked' : ''}><span class="${st.done[i] ? 'done' : ''}">${esc(q)}</span></label></li>`).join('');
  const cur = curRound(), nr = me.rounds.length;
  const isJailed = c => cur >= 0 && !!(st.jail[c.id] || [])[cur];
  const cast = others.map(c => `<div class="card"><div class="who">${avatar(c, false, isJailed(c))}<div><h3>${esc(c.name)}${isJailed(c) ? '<span class="tag">In jail</span>' : ''}</h3><p class="dim">${esc(c.description)}</p></div></div>
      <div class="jailrow" role="group" aria-label="Rounds ${esc(c.name)} was in jail"><span class="dim">In jail:</span>${Array.from({length: nr}, (_, i) => `<label><input type="checkbox" data-jail="${c.id}:${i}" ${(st.jail[c.id] || [])[i] ? 'checked' : ''}>Round ${i+1}</label>`).join('')}</div>
      <textarea data-note="${c.id}" aria-label="Notes on ${esc(c.name)}" placeholder="Your private notes on ${esc(c.name)}">${esc(st.notes[c.id] || '')}</textarea></div>`).join('');
  $('#app').innerHTML = `
    <div class="bar"><span class="dim">${esc(D.title)}</span><button class="ghost" data-act="logout">Log out</button></div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="${tab==='me'}" data-tab="me">My character</button>
      <button role="tab" aria-selected="${tab==='cast'}" data-tab="cast">Cast and notes</button></div>
    ${tab === 'me' ? `<div class="stack">
      <div class="who">${avatar(me, true)}<div><h1>${esc(me.name)}</h1><p>${esc(me.description)}</p></div></div>
      <h2>Hidden skills</h2><ul>${me.base.skills.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
      <h2>Side quests</h2><ul style="padding:0">${quests}</ul>
      <h2>Secrets and clues</h2>${rounds}</div>`
    : `<div class="stack"><p class="dim">Notes and jail marks stay on this device and are never shared.</p>${cast}
      <div class="row"><button class="ghost" data-act="copy">Copy all notes</button><span class="dim" id="copied"></span></div></div>`}`;
}

function renderLogin() {
  $('#app').innerHTML = `<h1>${esc(D.title)}</h1><p>${esc(D.intro)}</p>
    <form id="login" class="stack" style="margin-top:1.5rem">
      <label>Who are you playing?<select name="who">${D.characters.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>
      <label>Your passphrase<input name="pass" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
      <p class="err" role="alert" id="loginErr"></p>
      <button>Open my character</button></form>
    <h2>The cast</h2><div class="stack">${D.characters.map(c => `<div class="card"><div class="who">${avatar(c)}<div><h3>${esc(c.name)}</h3><p class="dim">${esc(c.description)}</p></div></div></div>`).join('')}</div>`;
}

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'login') {
    const ok = await login(f.who.value, f.pass.value);
    if (ok) render(); else $('#loginErr').textContent = "That passphrase doesn't match this character. Check the spelling and try again.";
  } else if (f.dataset.round !== undefined) {
    const i = +f.dataset.round, code = f.elements.roundcode.value;
    try { await unlock(i, code); }
    catch (x) {
      f.querySelector('.err').textContent = x.name === 'OperationError'
        ? `That code doesn't open round ${i + 1}. Check the spelling, or ask your host.`
        : `Couldn't open round ${i + 1} (${x.name}: ${x.message}). Reload the page and try again.`;
      return;
    }
    st.codes[i] = code; save(); render();
  }
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); }
  else if (t.dataset.act === 'logout') logout();
  else if (t.dataset.act === 'copy') {
    const txt = D.characters.filter(c => st.notes[c.id]).map(c => `${c.name}\n${st.notes[c.id]}`).join('\n\n');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(
      () => $('#copied').textContent = 'Copied.', () => $('#copied').textContent = 'Copy failed. Select the text in each note instead.');
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.note) { st.notes[e.target.dataset.note] = e.target.value; save(); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.jail) {
    const [id, n] = e.target.dataset.jail.split(':'), y = scrollY;
    (st.jail[id] = st.jail[id] || [])[+n] = e.target.checked; save(); render(); scrollTo(0, y); return;
  }
  if (e.target.dataset.quest !== undefined) { st.done[e.target.dataset.quest] = e.target.checked; save(); render(); }
});

(async () => {
  if (!window.crypto || !crypto.subtle) { $('#app').innerHTML = '<p>This page needs a secure connection. Open it over https:// or on localhost.</p>'; return; }
  try { D = await (await fetch('data.json', {cache: 'no-cache'})).json(); }
  catch { $('#app').innerHTML = '<p>Could not load data.json. Run <code>node build.mjs</code> and serve this folder over http.</p>'; return; }
  document.title = D.title;
  try { const s = JSON.parse(sessionStorage.getItem('mm:session')); if (s) await login(s.id, s.pass); } catch {}
  render();
})();
</script>
</body>
</html>
